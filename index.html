<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Sparkbench</title>
    <meta name="description" content="A circuit playground with a real solver underneath — draw a circuit, watch it come alive." />

    <!-- home-screen / standalone -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f2ede0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sparkbench" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #f2ede0; }
      /* the app owns its safe-area padding; adding it here too made the page
         taller than the viewport, which let the header scroll away */
      #root { height: 100%; }
      body { overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
